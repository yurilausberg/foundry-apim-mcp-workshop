openapi: 3.0.3
info:
  title: Synthetic Work Request API
  version: 1.0.0
  description: A synthetic API for workshop use. It contains no customer data.
servers:
  - url: https://example.invalid
paths:
  /work-requests/{requestId}:
    get:
      operationId: getWorkRequest
      summary: Get a work request
      description: Returns a synthetic work request by identifier.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          example: WR-1001
      responses:
        "200":
          description: Work request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkRequest"
              example:
                id: WR-1001
                title: Facility inspection services
                requester: Operations Team
                status: NeedsInformation
                amount: 25000
                currency: USD
                missingInformation:
                  - Statement of work
                  - Cost center
                updatedAt: "2026-09-23T16:00:00Z"
        "404":
          description: Work request not found
  /work-requests:
    post:
      operationId: createWorkRequest
      summary: Create a work request
      description: Creates a synthetic draft work request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkRequest"
      responses:
        "200":
          description: Created work request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkRequest"
              example:
                id: WR-1002
                title: Synthetic workshop request
                requester: Workshop Participant
                status: Draft
                amount: 25000
                currency: USD
                missingInformation: []
                updatedAt: "2026-09-29T20:00:00Z"
  /work-requests/{requestId}/status:
    patch:
      operationId: updateWorkRequestStatus
      summary: Update work request status
      description: Updates the workflow status of a synthetic work request.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          example: WR-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Updated work request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkRequest"
              example:
                id: WR-1001
                title: Facility inspection services
                requester: Operations Team
                status: ReadyForReview
                amount: 25000
                currency: USD
                missingInformation: []
                updatedAt: "2026-09-29T20:15:00Z"
components:
  schemas:
    WorkRequest:
      type: object
      required:
        - id
        - title
        - requester
        - status
        - amount
        - currency
      properties:
        id:
          type: string
          example: WR-1001
        title:
          type: string
          example: Facility inspection services
        requester:
          type: string
          example: Operations Team
        status:
          type: string
          enum:
            - Draft
            - NeedsInformation
            - ReadyForReview
            - Approved
            - Rejected
          example: NeedsInformation
        amount:
          type: number
          format: double
          example: 25000
        currency:
          type: string
          example: USD
        missingInformation:
          type: array
          items:
            type: string
          example:
            - Statement of work
            - Cost center
        updatedAt:
          type: string
          format: date-time
          example: 2026-09-23T16:00:00Z
    CreateWorkRequest:
      type: object
      required:
        - title
        - requester
        - amount
        - currency
      properties:
        title:
          type: string
        requester:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        description:
          type: string
    UpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - Draft
            - NeedsInformation
            - ReadyForReview
            - Approved
            - Rejected
        reason:
          type: string
