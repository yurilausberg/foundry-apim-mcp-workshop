# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"

name: foundry-apim-mcp-workshop

services:
  workshop-agent:
    host: azure.ai.agent
    project: src/Workshop.Agent
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: Workshop.Agent.dll
    kind: hosted
    name: work-request-workshop-agent
    displayName: Work Request Workshop Agent
    description: A workshop agent using APIM-hosted MCP tools.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      MCP_SERVER_ENDPOINT: ${MCP_SERVER_ENDPOINT}
      MCP_SERVER_NAME: work_request_tools

infra:
  provider: microsoft.foundry
